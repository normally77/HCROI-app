<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCROI Calculator & Analyzer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            background: #ffffff;
            margin: 20px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
            font-size: 0.9em;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #34495e;
        }
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd1d1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="number"]:focus {
            border-color: #3498db;
            outline: none;
        }
        button {
            width: 100%;
            background-color: #2ecc71;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #27ae60;
        }
        .result-box {
            margin-top: 30px;
            padding: 20px;
            background-color: #ebf5fb;
            border-left: 5px solid #3498db;
            border-radius: 4px;
            display: none;
        }
        .result-title {
            font-size: 18px;
            font-weight: bold;
            color: #2980b9;
            margin-bottom: 10px;
        }
        .hcroi-value {
            font-size: 32px;
            font-weight: bold;
            color: #2c3e50;
            margin: 10px 0;
        }
        .interpretation {
            margin-top: 15px;
            line-height: 1.6;
            font-size: 14px;
        }
        .formula-note {
            background: #fcf3cf;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            color: #b7950b;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>HCROI Calculator</h2>
    <div class="subtitle">เครื่องมือคำนวณผลตอบแทนจากการลงทุนในทุนมนุษย์</div>
    
    <div class="formula-note">
        <strong>สูตรคำนวณ:</strong> HCROI = [รายได้รวม - (ค่าใช้จ่ายทั้งหมด - ค่าใช้จ่ายด้านบุคลากร)] / ค่าใช้จ่ายด้านบุคลากร
    </div>

    <div class="form-group">
        <label for="revenue">1. รายได้รวม (Total Revenue) - บาท</label>
        <input type="number" id="revenue" placeholder="เช่น 10000000" min="0">
    </div>

    <div class="form-group">
        <label for="expenses">2. ค่าใช้จ่ายทั้งหมด (Total Operating Expenses) - บาท</label>
        <input type="number" id="expenses" placeholder="รวมค่าใช้จ่ายพนักงานแล้ว เช่น 7000000" min="0">
    </div>

    <div class="form-group">
        <label for="hc_expenses">3. ค่าใช้จ่ายด้านบุคลากรทั้งหมด (Total Human Capital Expenses) - บาท</label>
        <input type="number" id="hc_expenses" placeholder="เงินเดือน, สวัสดิการ, เทรนนิ่ง เช่น 3000000" min="0">
    </div>

    <button onclick="calculateHCROI()">คำนวณและวิเคราะห์ผลลัพธ์</button>

    <div id="resultBox" class="result-box">
        <div class="result-title">ผลการคำนวณ HCROI ขององค์กรท่าน</div>
        <div class="hcroi-value" id="hcroiValue">0.00</div>
        <div class="interpretation" id="interpretationText"></div>
    </div>
</div>

<script>
function calculateHCROI() {
    const revenue = parseFloat(document.getElementById('revenue').value);
    const expenses = parseFloat(document.getElementById('expenses').value);
    const hcExpenses = parseFloat(document.getElementById('hc_expenses').value);

    // Validation
    if (isNaN(revenue) || isNaN(expenses) || isNaN(hcExpenses)) {
        alert("กรุณากรอกข้อมูลให้ครบทุกช่องก่อนคำนวณครับ");
        return;
    }
    if (hcExpenses <= 0) {
        alert("ค่าใช้จ่ายด้านบุคลากรต้องมากกว่า 0");
        return;
    }
    if (hcExpenses > expenses) {
        alert("ค่าใช้จ่ายด้านบุคลากรไม่ควรมากกว่าค่าใช้จ่ายทั้งหมดรวมกัน กรุณาตรวจสอบตัวเลขอีกครั้ง");
        return;
    }

    // HCROI Calculation
    // Formula: (Revenue - (Expenses - HCExpenses)) / HCExpenses
    const nonHcExpenses = expenses - hcExpenses;
    const netProfitBeforeHC = revenue - nonHcExpenses;
    const hcroi = netProfitBeforeHC / hcExpenses;

    // Display Result
    document.getElementById('resultBox').style.display = 'block';
    document.getElementById('hcroiValue').innerText = hcroi.toFixed(2);

    // Dynamic Interpretation
    let interpretation = "";
    if (hcroi > 2.0) {
        interpretation = `<strong>📊 บทวิเคราะห์ระดับมืออาชีพ (Excellent):</strong><br>
        ค่า HCROI อยู่ที่ <b>${hcroi.toFixed(2)}</b> หมายความว่า <strong>ทุกๆ 1 บาทที่องค์กรลงทุนไปกับพนักงาน สามารถสร้างผลกำไรกลับคืนมาได้ถึง ${hcroi.toFixed(2)} บาท</strong> (หลังจากหักค่าใช้จ่ายอื่นๆ แล้ว)<br><br>
        🎯 <u>ข้อเสนอแนะเชิงกลยุทธ์:</u> ทุนมนุษย์ของท่านมีประสิทธิภาพสูงมาก (High Productivity) ควรเน้นย้ำการรักษาบุคลากรกลุ่มนี้ไว้ (Retention) และพิจารณาเพิ่มสวัสดิการหรือการพัฒนาทักษะ (Upskilling) เพื่อรักษาความได้เปรียบทางการแข่งขันนี้ไว้ระยะยาว`;
    } else if (hcroi >= 1.2 && hcroi <= 2.0) {
        interpretation = `<strong>📊 บทวิเคราะห์ระดับมืออาชีพ (Healthy):</strong><br>
        ค่า HCROI อยู่ที่ <b>${hcroi.toFixed(2)}</b> หมายความว่า <strong>ทุกๆ 1 บาทที่ลงทุนในพนักงาน สร้างผลกำไรกลับคืนมาได้ ${hcroi.toFixed(2)} บาท</strong> ซึ่งอยู่ในเกณฑ์มาตรฐานที่ดีของบริษัททั่วไป<br><br>
        🎯 <u>ข้อเสนอแนะเชิงกลยุทธ์:</u> องค์กรมีความคุ้มค่าในการจ้างงาน แต่อาจมีบางจุดที่ปรับปรุงเพิ่มได้ เช่น การนำระบบ Automation มาลดงาน Routine ของพนักงาน เพื่อดันให้พนักงานมีเวลาไปทำเนื้อหารายได้ที่สูงขึ้น (Value-added tasks)`;
    } else if (hcroi > 1.0 && hcroi < 1.2) {
        interpretation = `<strong>📊 บทวิเคราะห์ระดับมืออาชีพ (Caution/Marginal):</strong><br>
        ค่า HCROI อยู่ที่ <b>${hcroi.toFixed(2)}</b> สะท้อนว่าการลงทุนในบุคลากรสร้างผลตอบแทนคาบเส้นพอดี (ได้กำไรกลับมาเฉียดฉิว)<br><br>
        🎯 <u>ข้อเสนอแนะเชิงกลยุทธ์:</u> ควรมองหาจุดรั่วไหลเชิงโครงสร้าง เช่น อัตราการลาออก (Turnover Rate) ที่สูงเกินไปทำให้เสียค่าดึงดูดคนใหม่ หรือกระบวนการทำงานซ้ำซ้อน ควรทำ Performance Management อย่างเข้มข้นขึ้น`;
    } else {
        interpretation = `<strong>📊 บทวิเคราะห์ระดับมืออาชีพ (Critical/Underperforming):</strong><br>
        ค่า HCROI อยู่ที่ <b>${hcroi.toFixed(2)}</b> ซึ่งต่ำกว่า 1.0 หมายความว่า <strong>การลงทุนในพนักงานยังไม่สามารถสร้างผลกำไรครอบคลุมค่าตัวได้ (ติดลบในเชิงความคุ้มค่า)</strong><br><br>
        🎯 <u>ข้อเสนอแนะเชิงกลยุทธ์:</u> จำเป็นต้องเร่งปรับโครงสร้างกำลังคน (Workforce Restructuring) หรือทบทวนโมเดลธุรกิจอย่างเร่งด่วน อาจเกิดจาก Overstaffing (คนล้นงาน) หรือพนักงานขาดทักษะที่จำเป็นในการสร้างรายได้ยุคปัจจุบัน`;
    }

    document.getElementById('interpretationText').innerHTML = interpretation;
}
</script>

</body>
</html>
